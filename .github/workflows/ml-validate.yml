# One-off, read-only comparison: equal-weight (current live default) vs.
# ml_walkforward signal weighting, both run against the SAME real PIT store
# (restored from the existing pit-data-v1- cache built by bootstrap-seeds +
# daily paper-trade runs). Does not ingest, does not trade, does not touch
# live config.yaml or the paper account. Trigger from the Actions tab.

name: ml-validate

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-trading-model-plan-3mpudt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore PIT store cache (real data, read-only)
        uses: actions/cache/restore@v4
        with:
          path: pit_data
          key: pit-data-v1-nonexistent-key-forces-restore-keys-lookup
          restore-keys: |
            pit-data-v1-

      - name: Confirm real data restored
        run: |
          test -f pit_data/daybreak.duckdb || { echo "no cached PIT store found - nothing to validate against"; exit 1; }
          python3 -c "
          import duckdb
          con = duckdb.connect('pit_data/daybreak.duckdb', read_only=True)
          n = con.execute('select count(*) from prices').fetchone()[0]
          lo, hi = con.execute('select min(date), max(date) from prices').fetchone()
          print(f'real price rows: {n}, range: {lo} .. {hi}')
          "

      - name: Build ml_walkforward side config
        run: |
          python3 -c "
          s = open('config.yaml').read().replace(
              'weighting_mode: equal        # equal (default, validated) | ml_walkforward',
              'weighting_mode: ml_walkforward  # ONE-OFF COMPARISON RUN')
          open('/tmp/ml_config.yaml', 'w').write(s)
          "
          diff config.yaml /tmp/ml_config.yaml || true

      - name: Backtest + validate — equal (live baseline)
        run: |
          echo "## equal (live baseline)" >> "$GITHUB_STEP_SUMMARY"
          python3 -m daybreak.backtest.run | tee /tmp/bt_equal.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bt_equal.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 -m daybreak.validate.harness | tee /tmp/val_equal.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/val_equal.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cp reports/backtest_metrics.json /tmp/bt_equal.json

      - name: Backtest + validate — ml_walkforward (experimental)
        run: |
          echo "## ml_walkforward (experimental)" >> "$GITHUB_STEP_SUMMARY"
          python3 -m daybreak.backtest.run --config /tmp/ml_config.yaml | tee /tmp/bt_ml.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bt_ml.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 -m daybreak.validate.harness --config /tmp/ml_config.yaml | tee /tmp/val_ml.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/val_ml.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cp reports/backtest_metrics.json /tmp/bt_ml.json

      - name: Side-by-side summary
        run: |
          echo "## side by side" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json
          a = json.load(open('/tmp/bt_equal.json'))
          b = json.load(open('/tmp/bt_ml.json'))
          keys = ['net_total_return', 'net_annual_return', 'net_sharpe', 'net_sortino',
                  'max_drawdown', 'avg_daily_turnover', 'pct_days_in_cash', 'total_costs']
          print('| metric | equal | ml_walkforward |')
          print('|---|---|---|')
          for k in keys:
              print(f'| {k} | {a[\"metrics\"][k]} | {b[\"metrics\"][k]} |')
          " | tee -a "$GITHUB_STEP_SUMMARY"
