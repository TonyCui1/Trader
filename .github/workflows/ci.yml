name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (includes leakage tripwire)
        run: make test
      - name: Fixture ingest (bit-reproducible)
        run: make ingest-fixture
      - name: Backtest
        run: make backtest
      - name: Validation harness (must be all green)
        run: make validate
      - name: Paper dry-run
        run: make paper-dry-run
